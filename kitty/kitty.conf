# ── Font ──────────────────────────────────────
font_family      JetBrainsMono Nerd Font
bold_font        JetBrainsMono Nerd Font Bold
italic_font      JetBrainsMono Nerd Font Italic
bold_italic_font JetBrainsMono Nerd Font Bold Italic
font_size        13.0

# ── Cursor ────────────────────────────────────
cursor                  #b85c2a
cursor_text_color       #0e1016
cursor_shape            block
cursor_blink_interval   0

# ── Scrollback ────────────────────────────────
scrollback_lines 10000

# ── Mouse ─────────────────────────────────────
mouse_hide_wait 2.0

# ── Window ────────────────────────────────────
window_padding_width     8 10
window_padding_height    0
hide_window_decorations  yes
background_opacity       0.95
dynamic_background_color no

# ── Tab bar ───────────────────────────────────
tab_bar_edge             bottom
tab_bar_style            powerline
tab_powerline_style      slanted
tab_title_template       " {index}: {title} "
active_tab_foreground    #0e1016
active_tab_background    #b85c2a
active_tab_font_style    bold
inactive_tab_foreground  #4a5260
inactive_tab_background  #1c2030
inactive_tab_font_style  normal
tab_bar_background       #0e1016

# ── Colors ────────────────────────────────────
foreground  #c8d4e8
background  #0e1016

# Black
color0  #1c2030
color8  #2e3650

# Red
color1  #e05a3a
color9  #e86a4a

# Green
color2  #6a9a5a
color10 #7aaa6a

# Yellow
color3  #b85c2a
color11 #c87a3a

# Blue
color4  #3a6a9a
color12 #4a7aaa

# Magenta
color5  #7a5a9a
color13 #8a6aaa

# Cyan
color6  #3a7a8a
color14 #4a8a9a

# White
color7  #c8d4e8
color15 #dde6f2

# Selection
selection_foreground #0e1016
selection_background #b85c2a

# URL
url_color           #b85c2a
url_style           curly

# ── Bell ──────────────────────────────────────
enable_audio_bell no
visual_bell_duration 0.0

# ── Misc ──────────────────────────────────────
shell                        zsh
editor                       nvim
close_on_child_death         no
allow_remote_control         yes
listen_on                    unix:/tmp/kitty
update_check_interval        0
