# ══════════════════════════════════════════════
# KITTY CONFIG — CYBERPUNK THEME
# Yellow #FFE000 / Black #0a0a0a
# ══════════════════════════════════════════════

# ── Font ──────────────────────────────────────
font_family      JetBrainsMono Nerd Font
bold_font        JetBrainsMono Nerd Font Bold
italic_font      JetBrainsMono Nerd Font Italic
bold_italic_font JetBrainsMono Nerd Font Bold Italic
font_size        12.0

# ── Cursor ────────────────────────────────────
cursor                  #FFE000
cursor_text_color       #0a0a0a
cursor_shape            block
cursor_blink_interval   0

# ── Scrollback ────────────────────────────────
scrollback_lines 10000

# ── Mouse ─────────────────────────────────────
mouse_hide_wait 2.0

# ── Window ────────────────────────────────────
window_padding_width     8 10
window_padding_height    0
hide_window_decorations  yes
background_opacity       0.92
dynamic_background_color no

# ── Tab bar ───────────────────────────────────
tab_bar_edge             bottom
tab_bar_style            powerline
tab_powerline_style      slanted
tab_title_template       " {index}: {title} "
active_tab_foreground    #0a0a0a
active_tab_background    #FFE000
active_tab_font_style    bold
inactive_tab_foreground  #666666
inactive_tab_background  #111111
inactive_tab_font_style  normal
tab_bar_background       #0a0a0a

# ── Colors ────────────────────────────────────
foreground  #FFE000
background  #0a0a0a

# Black
color0  #0f0f0f
color8  #333333

# Red
color1  #ff2244
color9  #ff4466

# Green
color2  #00ff88
color10 #33ffaa

# Yellow
color3  #FFE000
color11 #fff066

# Blue
color4  #0088ff
color12 #33aaff

# Magenta
color5  #cc00ff
color13 #dd44ff

# Cyan
color6  #00ccff
color14 #33ddff

# White
color7  #cccccc
color15 #eeeeee

# Selection
selection_foreground #0a0a0a
selection_background #FFE000

# URL
url_color           #FFE000
url_style           curly

# ── Bell ──────────────────────────────────────
enable_audio_bell no
visual_bell_duration 0.0

# ── Misc ──────────────────────────────────────
shell                        zsh
editor                       nvim
close_on_child_death         no
allow_remote_control         yes
listen_on                    unix:/tmp/kitty
update_check_interval        0
