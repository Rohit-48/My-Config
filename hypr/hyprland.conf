################
### MONITORS ###
################

monitor=,preferred,auto,1

###################
### MY PROGRAMS ###
###################

$terminal    = ghostty
$fileManager = dolphin
$menu        = rofi -show drun

#################
### AUTOSTART ###
#################

exec-once = swww-daemon
exec-once = swww img /home/giyu/Pictures/Wallpapers/c7.png --transition-type center
exec-once = wal -i /home/giyu/Pictures/Wallpapers/c7.png
exec-once = hyprpaper
exec-once = waybar
exec-once = eww daemon
exec-once = hypridle
exec-once = dunst

blurls = waybar

#############################
### ENVIRONMENT VARIABLES ###
#############################

env = XCURSOR_THEME,Adwaita
env = HYPRSHOT_DIR,~/Pictures/Screenshots/

#####################
### LOOK AND FEEL ###
#####################

general {
    gaps_in  = 2
    gaps_out = 2 

    border_size = 2

    col.active_border   = rgba(FFE000ff)
    col.inactive_border = rgba(1c1c1c99)

    resize_on_border = true
    allow_tearing    = false
    layout           = dwindle
}

decoration {
    rounding       = 6
    rounding_power = 2

    active_opacity   = 1.0
    inactive_opacity = 0.88

    shadow {
        enabled        = true
        range          = 16
        render_power   = 3
        color          = rgba(FFE00022)
        color_inactive = rgba(00000055)
    }

    blur {
        enabled           = true
        size              = 5
        passes            = 2
        vibrancy          = 0.16
        new_optimizations = true
    }
}

animations {
    enabled = yes

    bezier = cyberOut,  0.16, 1,    0.3,  1
    bezier = cyberIn,   0.7,  0,    0.84, 0
    bezier = cyberSnap, 0.1,  0.9,  0.2,  1
    bezier = quick,     0.15, 0,    0.1,  1

    # NO borderangle — that causes the spinning/blinking border
    animation = border,        1,  3,    cyberOut
    animation = windows,       1,  4,    cyberOut
    animation = windowsIn,     1,  3,    cyberSnap, popin 80%
    animation = windowsOut,    1,  2,    cyberIn,   popin 80%
    animation = fade,          1,  3,    quick
    animation = fadeIn,        1,  2,    cyberOut
    animation = fadeOut,       1,  1.5,  cyberIn
    animation = layers,        1,  3,    cyberOut
    animation = layersIn,      1,  3,    cyberOut,  fade
    animation = layersOut,     1,  2,    cyberIn,   fade
    animation = workspaces,    1,  3,    cyberSnap, slidefade 20%
    animation = workspacesIn,  1,  3,    cyberSnap, slidefade 20%
    animation = workspacesOut, 1,  2,    cyberIn,   slidefade 20%
}

# Smart gaps — zero gap/border when only one tiled window
workspace = w[tv1], gapsout:0, gapsin:0
workspace = f[1],   gapsout:0, gapsin:0

dwindle {
    pseudotile     = true
    preserve_split = true
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = -1
    disable_hyprland_logo   = false
}

#############
### INPUT ###
#############

input {
    kb_layout  = us
    kb_variant =
    kb_model   =
    kb_options =
    kb_rules   =

    follow_mouse = 1
    sensitivity  = 0

    touchpad {
        natural_scroll = false
    }
}

device {
    name        = epic-mouse-v1
    sensitivity = -0.5
}

###################
### KEYBINDINGS ###
###################

$mainMod = SUPER

# Apps
bind = CTRL SHIFT, B, exec, brave
bind = CTRL SHIFT, D, exec, discord
bind = CTRL SHIFT, S, exec, spotify
bind = CTRL SHIFT, Q, exec, code
bind = CTRL SHIFT, A, exec, arduino
bind = CTRL SHIFT, Y, exec, brave youtube.com
bind = CTRL SHIFT, G, exec, brave github.com/Rohit-48
bind = CTRL SHIFT, N, exec, brave search.nixos.org
bind = CTRL SHIFT, M, exec, brave music.youtube.com
bind = CTRL SHIFT, O, exec, obsidian
bind = CTRL SHIFT, X, exec, brave x.com/home

# Core
bind = $mainMod, RETURN, exec, $terminal
bind = $mainMod, Q,      killactive,
bind = $mainMod, E,      exec, $fileManager
bind = $mainMod, V,      togglefloating,
bind = $mainMod, R,      exec, $menu
bind = $mainMod, P,      pseudo,
bind = $mainMod, J,      togglesplit,
bind = SUPER,    L,      exec, hyprlock

# Screenshots
bind = SUPER SHIFT, S, exec, grim -g "$(slurp)" - | wl-copy
bind = SUPER SHIFT, R, exec, wf-recorder -g "$(slurp)" -f /home/giyu/Video/recording_$(date +%s).mp4
bind = SUPER SHIFT, X, exec, pkill wf-recorder
bind = SUPER,       V, exec, cliphist list | wofi --dmenu | cliphist decode | wl-copy
bind = ,      Print,   exec, hyprshot -m output
bind = SHIFT, Print,   exec, hyprshot -m window
bind = ALT,   Print,   exec, hyprshot -m region

# Focus
bind = $mainMod, left,  movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up,    movefocus, u
bind = $mainMod, down,  movefocus, d

# Move windows
bind = $mainMod, W, movewindow, u
bind = $mainMod, A, movewindow, l
bind = $mainMod, S, movewindow, d
bind = $mainMod, D, movewindow, r

# Workspaces
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

bind = $mainMod, bracketright, workspace, e+1
bind = $mainMod, bracketleft,  workspace, e-1

bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up,   workspace, e-1

bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Media keys
bindel = , XF86AudioRaiseVolume,  exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume,  exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = , XF86AudioMute,         exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86AudioMicMute,      exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = , XF86MonBrightnessUp,   exec, brightnessctl -e4 -n2 set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

bindl = , XF86AudioNext,  exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay,  exec, playerctl play-pause
bindl = , XF86AudioPrev,  exec, playerctl previous

##############################
### WINDOWS AND WORKSPACES ###
##############################
