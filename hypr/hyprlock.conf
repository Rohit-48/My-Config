# ╔══════════════════════════════════════════╗
# ║   hyprlock.conf  —  CYBERPUNK THEME      ║
# ║   Yellow / Black  |  JetBrainsMono       ║
# ╚══════════════════════════════════════════╝

general {
    disable_loading_bar  = false
    grace                = 0
    hide_cursor          = true
    no_fade_in           = false
    no_fade_out          = false
    ignore_empty_input   = false
    text_trim            = true
}

# ── Background ────────────────────────────────────────────────
background {
    monitor       =
    path          = screenshot

    blur_passes   = 4
    blur_size     = 8
    noise         = 0.02
    contrast      = 0.9
    brightness    = 0.6
    vibrancy      = 0.1
    vibrancy_darkness = 0.3
}

# ── Clock ─────────────────────────────────────────────────────
label {
    monitor     =
    text        = cmd[update:1000] echo "$(date +"%H:%M")"
    color       = rgba(FFE000, 1.0)
    font_size   = 96
    font_family = JetBrains Mono Nerd Font Bold

    shadow_passes = 3
    shadow_size   = 6
    shadow_color  = rgba(0, 0, 0, 0.8)
    shadow_boost  = 1.5

    position = 0, 120
    halign   = center
    valign   = center
}

# ── Date ──────────────────────────────────────────────────────
label {
    monitor     =
    text        = cmd[update:60000] echo "$(date +"%A, %B %d")"
    color       = rgba(FFE000, 0.7)
    font_size   = 20
    font_family = JetBrains Mono Nerd Font

    shadow_passes = 2
    shadow_size   = 3
    shadow_color  = rgba(0, 0, 0, 0.7)

    position = 0, 50
    halign   = center
    valign   = center
}

# ── Greeting ──────────────────────────────────────────────────
label {
    monitor     =
    text        = welcome back, $USER
    color       = rgba(FFE000, 0.45)
    font_size   = 14
    font_family = JetBrains Mono Nerd Font

    position = 0, 10
    halign   = center
    valign   = center
}

# ── Password input ────────────────────────────────────────────
input-field {
    monitor   =
    size      = 320, 52
    outline_thickness = 2

    dots_size     = 0.3
    dots_spacing  = 0.2
    dots_center   = true
    dots_rounding = 6

    outer_color  = rgb(FFE000)
    inner_color  = rgb(10, 10, 10)
    font_color   = rgb(FFE000)
    fade_on_empty   = true
    fade_timeout    = 1000

    placeholder_text = <span foreground="##b8a000"><i>passphrase...</i></span>
    hide_input   = false
    rounding     = 6

    check_color  = rgb(00ff88)
    fail_color   = rgb(ff2244)
    fail_text    = <i>$FAIL  ($ATTEMPTS)</i>
    fail_timeout = 2000
    fail_transition = 300

    position = 0, -80
    halign   = center
    valign   = center
}

# ── Now playing ───────────────────────────────────────────────
label {
    monitor     =
    text        = cmd[update:2000] echo "$(playerctl metadata --format '{{ artist }} — {{ title }}' 2>/dev/null || echo '')"
    color       = rgba(FFE000, 0.5)
    font_size   = 12
    font_family = JetBrains Mono Nerd Font Italic

    position = 0, 30
    halign   = center
    valign   = bottom
}

# ── Battery ───────────────────────────────────────────────────
label {
    monitor     =
    text        = cmd[update:30000] echo "󰁹 $(cat /sys/class/power_supply/BAT0/capacity 2>/dev/null || echo '?')%"
    color       = rgba(FFE000, 0.65)
    font_size   = 13
    font_family = JetBrains Mono Nerd Font

    position = -20, 20
    halign   = right
    valign   = bottom
}
