# ╔════════════════════════════════════════╗
# ║          hyprlock.conf                 ║
# ║    Lock screen config for Hyprland     ║
# ╚════════════════════════════════════════╝

# ─────────────────────────────────────────
# GENERAL
# ─────────────────────────────────────────
general {
    disable_loading_bar    = false
    grace                  = 0          # seconds before lock activates (0 = instant)
    hide_cursor            = true
    no_fade_in             = false
    no_fade_out            = false
    ignore_empty_input     = false
    text_trim              = true
}


# ─────────────────────────────────────────
# BACKGROUND
# ─────────────────────────────────────────
background {
    monitor    =                          # leave empty for all monitors
    path       = screenshot               # use "screenshot" to blur current screen
                                          # or set a path: /home/user/wallpaper.png

    blur_passes     = 3
    blur_size       = 7
    noise           = 0.0117
    contrast        = 0.8916
    brightness      = 0.8172
    vibrancy        = 0.1696
    vibrancy_darkness = 0.0
}


# ─────────────────────────────────────────
# INPUT FIELD (password box)
# ─────────────────────────────────────────
input-field {
    monitor    =
    size       = 300, 50
    outline_thickness = 3

    dots_size       = 0.33              # scale of dot relative to box height
    dots_spacing    = 0.15              # spacing between dots (0 to 1)
    dots_center     = true
    dots_rounding   = -1                # -1 = inherit from rounding

    outer_color     = rgb(151515)
    inner_color     = rgb(200, 200, 200)
    font_color      = rgb(10, 10, 10)
    fade_on_empty   = true
    fade_timeout    = 1000              # ms before fading when empty

    placeholder_text = <i>Password...</i>
    hide_input       = false
    rounding         = -1               # -1 = inherit from general rounding

    check_color      = rgb(204, 136, 34)
    fail_color       = rgb(204, 34,  34)
    fail_text        = <i>$FAIL <b>($ATTEMPTS)</b></i>
    fail_timeout     = 2000             # ms to show fail message
    fail_transition  = 300             # ms of animation

    capslock_color   = -1
    numlock_color    = -1
    bothlock_color   = -1
    invert_numlock   = false
    swap_font_color  = false

    position = 0, -80
    halign   = center
    valign   = center
}


# ─────────────────────────────────────────
# CLOCK (time)
# ─────────────────────────────────────────
label {
    monitor  =
    text     = cmd[update:1000] echo "$(date +"%H:%M:%S")"
    color    = rgba(200, 200, 200, 1.0)
    font_size   = 72
    font_family = JetBrains Mono Nerd Font Bold

    shadow_passes    = 3
    shadow_size      = 4
    shadow_color     = rgba(0, 0, 0, 0.5)
    shadow_boost     = 1.2

    position = 0, 80
    halign   = center
    valign   = center
}


# ─────────────────────────────────────────
# DATE
# ─────────────────────────────────────────
label {
    monitor  =
    text     = cmd[update:60000] echo "$(date +"%A, %B %d")"
    color    = rgba(200, 200, 200, 0.85)
    font_size   = 22
    font_family = JetBrains Mono Nerd Font

    shadow_passes = 2
    shadow_size   = 3

    position = 0, 0
    halign   = center
    valign   = center
}


# ─────────────────────────────────────────
# GREETING / USERNAME
# ─────────────────────────────────────────
label {
    monitor  =
    text     = Hi, $USER 
    color    = rgba(200, 200, 200, 0.75)
    font_size   = 16
    font_family = JetBrains Mono Nerd Font

    position = 0, -40
    halign   = center
    valign   = center
}


# ─────────────────────────────────────────
# OPTIONAL: MEDIA / NOW PLAYING
# Uncomment if you want a media label.
# Requires playerctl installed.
# ─────────────────────────────────────────
label {
    monitor  =
    text     = cmd[update:2000] echo "$(playerctl metadata --format '{{ artist }} – {{ title }}' 2>/dev/null || echo '')"
    color    = rgba(200, 200, 200, 0.65)
    font_size   = 13
    font_family = JetBrains Mono Nerd Font Italic
    position = 0, 40
    halign   = center
    valign   = bottom
}


# ─────────────────────────────────────────
# OPTIONAL: BATTERY INDICATOR
# Uncomment if you're on a laptop.
# ─────────────────────────────────────────
label {
    monitor  =
    text     = cmd[update:30000] echo "🔋 $(cat /sys/class/power_supply/BAT0/capacity)%"
    color    = rgba(200, 200, 200, 0.7)
    font_size   = 14
    font_family = JetBrains Mono Nerd Font
    position = -20, 20
    halign   = right
    valign   = bottom
}
